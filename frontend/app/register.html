<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - EchoSEO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <h2><span style="color:#7B61FF;">Echo</span>SEO</h2>
    <p>Crea tu cuenta para comenzar a auditar</p>

    <form id="registerForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" placeholder="tu@empresa.com" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
      </div>
      <button type="submit" class="auth-btn" id="submitBtn">Crear cuenta</button>
    </form>

    <div class="auth-links">
      ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
    </div>
  </div>

  <script src="js/services/authService.js"></script>

</body>
</html>
